schema:
  - schema/*.graphql

exec:
  package: api
  layout: single-file
  filename: internal/pkg/graphql/api/generated.go

model:
  filename: internal/pkg/graphql/api/model/models_gen.go
  package: model


resolver:
  package: resolver
  layout: single-file

  filename: internal/pkg/graphql/api/resolver/resolver.go

  preserve_resolver: true

call_argument_directives_with_null: true
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int64
  Int64:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
